name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare site files
        run: |
          mkdir -p _site/assets/demos
          cp index.html styles.css script.js _site/
          cp assets/megha-portrait.jpeg assets/MeghaNeelamana_resume.pdf _site/assets/
          cp assets/demos/*.mp4 _site/assets/demos/
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
